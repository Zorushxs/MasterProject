<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proyectos</title>
<link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-top">
      <h1><button id="homeBtn" class="home" title="Ir al inicio">Proyectos</button></h1>
      <button id="themeBtn" class="ghost" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    </div>
    <input id="search" type="search" placeholder="Buscar…" aria-label="Buscar proyectos">
    <div id="filters" class="filters"></div>
    <ul id="list" class="list"></ul>
    <button id="newBtn" class="primary">Nuevo proyecto</button>
    <div class="side-foot">
      <span id="saveState" class="state"></span>
      <div class="tools">
        <button id="exportBtn" class="ghost">Exportar</button>
        <button id="importBtn" class="ghost">Importar</button>
        <button id="fileBtn" class="ghost">Archivo</button>
      </div>
    </div>
  </aside>
  <main class="main">
    <div id="banner" class="banner" hidden></div>
    <div id="editor"></div>
  </main>
</div>
<input id="importInput" type="file" accept=".json,application/json" hidden>
<script src="js/almacen.js?v=3"></script>
<script src="js/store.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
